name: Proof HTML
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Fuzz Report
        run: |
          python3 compile_fuzz_report.py
          cat fuzz_check.csv
      - name: Remove heavy output
        run: rm -rf MOSFETQexchange/output
      - name: Proof HTML
        uses: anishathalye/proof-html@v1.1.0
        with:
          directory: ./
          check_favicon: false
          check_opengraph: false
          disable_external: true
          ignore_missing_alt: true
          ignore_empty_alt: true

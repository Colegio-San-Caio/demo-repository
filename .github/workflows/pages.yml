name: Deploy page
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r *.html *.tex *.pdf *.txt *.jpg assets $(ls *.img *.vhd *.tex *.pdf emu_dos.py emu_worker.js demo.js 2>/dev/null) _site/
      - name: Build book.pdf from main.tex
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-recommended texlive-fonts-recommended
          pdflatex -interaction=nonstopmode main.tex
          pdflatex -interaction=nonstopmode main.tex
          cp main.pdf _site/book.pdf
      - name: Build repo and release list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash build_repos.sh repos.html || echo '<!-- repo list unavailable -->' > repos.html
          sed -i -e '/<!--REPOS-->/{r repos.html' -e 'd}' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

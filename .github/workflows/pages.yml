name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site/assets
          ls -lh
          echo "--- copying ---"
          cp -v *.html _site/ 2>/dev/null || true
          cp -v *.txt *.tex *.pdf *.jpg *.png _site/ 2>/dev/null || true
          cp -v *.txt *.tex *.pdf *.jpg *.png _site/assets/ 2>/dev/null || true
          [ -d assets ] && cp -rv assets/* _site/assets/ 2>/dev/null || true
          # also copy any other listed assets
          for f in $(ls *.img *.vhd *.tex *.pdf emu_dos.py emu_worker.js demo.js 2>/dev/null); do cp -v "$f" _site/ 2>/dev/null || true; cp -v "$f" _site/assets/ 2>/dev/null || true; done
          ls -lh _site/ | head -n 40
          ls -lh _site/assets/ | head -n 40
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site

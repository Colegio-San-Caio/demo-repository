name: Archive
on: [push]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Colegio-San-Caio/marketplace@v1
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add archive/ catalog.js || echo "no files yet"
          git commit -m "archive" || true
          git push

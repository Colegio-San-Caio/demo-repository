name: Archive
on:
  push:
    paths-ignore:
      - 'archive/**'
      - 'catalog.js'
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Colegio-San-Caio/marketplace@v1
      - name: sync to docs
        run: |
          bash sync-docs.sh
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -A
          git commit -m "archive [skip ci]" || echo "nothing"
          git push

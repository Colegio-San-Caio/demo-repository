<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galeria Wiki - San Caio</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#fffef7;color:#102a7a;padding:20px}
.bar{background:#0a194e;color:white;text-align:center;padding:8px;font-size:12px;border-radius:10px;margin-bottom:16px}
.box{background:white;border:2px solid #102a7a;border-radius:18px;padding:18px;margin-bottom:14px}
.btn{padding:8px 14px;border-radius:10px;font-weight:700;text-decoration:none;border:2px solid #102a7a;display:inline-flex;margin:4px}
.btn-blue{background:#1a4cff;color:white}.btn-yellow{background:#ffbe1a}.btn-white{background:white}
pre{background:#f5f7ff;padding:12px;border-radius:10px;overflow:auto;font-size:13px;white-space:pre-wrap}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
</head><body>
<div class="bar">Wiki Oficial - wiki.txt + wiki-box.html + wiki-google-box.html - org.int</div>
<div style="max-width:1100px;margin:0 auto 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
<div><strong>Colegio San Caio</strong> | Galeria Wiki</div>
<div><a class="btn btn-white" href="./index.html">Inicio</a><a class="btn btn-white" href="./org.html">org.int</a><a class="btn btn-white" href="./macro.html">Macro</a></div>
</div>

<div class="grid" style="max-width:1100px;margin:0 auto">
<div class="box"><h3>wiki.txt</h3><pre id="t">Loading...</pre><a class="btn btn-white" href="./wiki.txt" target="_blank">Abrir raw</a></div>
<div class="box"><h3>wiki-box.html</h3><p style="font-size:12px;opacity:.7">Box view</p><a class="btn btn-yellow" href="./wiki-box.html" target="_blank">Abrir wiki-box.html</a><div style="margin-top:10px"><iframe src="./wiki-box.html" style="width:100%;height:200px;border:2px solid #102a7a;border-radius:10px"></iframe></div></div>
<div class="box full"><h3>wiki-google-box.html</h3><a class="btn btn-white" href="./wiki-google-box.html" target="_blank">Abrir google box</a><iframe src="./wiki-google-box.html" style="width:100%;height:350px;border:2px solid #102a7a;border-radius:10px;margin-top:10px"></iframe></div>
<div class="box full" style="background:#e8ecff"><h3>MediaWiki + Scripts</h3><a class="btn btn-white" href="./wiki-mediawiki.sh" target="_blank">wiki-mediawiki.sh</a><a class="btn btn-white" href="./wiki.txt" target="_blank">wiki.txt</a><a class="btn btn-blue" href="./srt.png" target="_blank">srt.png</a></div>
</div>
<script>fetch('./wiki.txt').then(r=>r.text()).then(t=>{document.getElementById('t').textContent=t.slice(0,2500)}).catch(()=>{document.getElementById('t').textContent='wiki.txt not found'})</script>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XIMG Registry Editor - kdp.ximg</title>
<style>
body{background:#000;color:#fff;font-family:monospace;margin:0;padding:12px}
h1{font-size:18px}.box{border:1px solid #333;padding:10px;margin:10px 0}
label{display:block;margin:6px 0}input{background:#111;color:#0ff;border:1px solid #333;padding:6px;width:90%}
canvas{image-rendering:pixelated;border:2px solid #fff;background:#000;max-width:100%;cursor:crosshair}
button{background:#0ff;color:#000;border:0;padding:10px 14px;font-weight:bold;margin:4px 4px 4px 0}
a{color:#0ff}
.tree{white-space:pre;line-height:1.6}
</style></head><body>
<h1>🧬 XIMG Registry Editor - kdp.ximg</h1>
<p>Like regedit, but for XIMG. Edit Header + Pixels -> Export new .ximg</p>

<div class="box">
<b>1. Load</b><br>
<input type="file" id="f" accept=".ximg,.raw"><br>
<select id="fileSel" style="background:#111;color:#fff;border:1px solid #333;padding:8px">
<option value="kdp.ximg">kdp.ximg - KDP / TIER</option>
<option value="rm.ximg">rm.ximg - RM / Registry Manager</option>
</select>
<button onclick="loadDefault()">Load Selected</button>
<button onclick="newBlank()">New Blank 120x64</button>
</div>

<div class="box">
<b>2. Registry - Header</b>
<div class="tree" id="tree">No file loaded</div>
<label>Magic (4 chars) <input id="magic" value="XIMG" maxlength="4"></label>
<label>Version Byte 4 <input id="v0" type="number" value="1"></label>
<label>Version Byte 5 <input id="v1" type="number" value="1"></label>
<label>Width <input id="w" type="number" value="120"></label>
<label>Height (from raw / width) <input id="h" type="number" value="64" readonly></label>
<label>Zlib Offset <input id="off" type="number" value="14"></label>
</div>

<div class="box">
<b>3. Pixel Editor - Click to paint</b><br>
Color: <input type="color" id="col" value="#ffffff"> 
Brush: <input type="range" id="brush" min="1" max="8" value="1"> <span id="bs">1</span>
<button onclick="fillPattern()">Fill 14 18 20 FF Pattern</button>
<button onclick="clearAll()">Clear Black</button>
<br><br>
<canvas id="cv" width="120" height="64" style="width:480px;height:256px"></canvas>
<p>Pixels: <span id="info">-</span></p>
</div>

<div class="box">
<b>4. Export</b><br>
<button onclick="exportXIMG()">⬇ Download NEW .ximg</button>
<button onclick="exportRAW()">⬇ Download .raw</button>
<button onclick="exportPNG()">⬇ Download .png</button>
<p id="out"></p>
</div>

<script>
let W=120,H=64,pix=new Uint8Array(120*64);
let cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function draw(){
  let img=ctx.createImageData(W,H);
  for(let i=0;i<pix.length;i++){img.data[i*4]=pix[i];img.data[i*4+1]=pix[i];img.data[i*4+2]=pix[i];img.data[i*4+3]=255;}
  ctx.putImageData(img,0,0);
  document.getElementById('info').textContent=W+' x '+H+' = '+pix.length+' bytes';
  document.getElementById('tree').textContent=
`XIMG
├── Header
│   ├── Magic: ${document.getElementById('magic').value}
│   ├── Version: ${document.getElementById('v0').value} ${document.getElementById('v1').value}
│   ├── Width: ${W}
│   ├── Height: ${H}
│   └── Offset: ${document.getElementById('off').value}
└── Payload
    ├── Raw: ${pix.length} bytes
    └── Pattern: ${pix[0].toString(16)} ${pix[1].toString(16)} ${pix[2].toString(16)} ${pix[3].toString(16)} ...`;
}
function fillPattern(){let p=[0x14,0x18,0x20,0xFF];for(let i=0;i<pix.length;i++)pix[i]=p[i%4];draw();}
function clearAll(){pix.fill(0);draw();}
function newBlank(){W=120;H=64;pix=new Uint8Array(W*H);cv.width=W;cv.height=H;draw();}
async function parseXIMG(buf){
  let d=new Uint8Array(buf);
  document.getElementById('magic').value=new TextDecoder().decode(d.slice(0,4));
  document.getElementById('v0').value=d[4];document.getElementById('v1').value=d[5];
  W=d[6]|(d[7]<<8);document.getElementById('w').value=W;
  let off=14;document.getElementById('off').value=off;
  let ds=new DecompressionStream('deflate');
  let raw=await new Response(new Blob([d.slice(off)]).stream().pipeThrough(ds)).arrayBuffer();
  pix=new Uint8Array(raw);H=pix.length/W;document.getElementById('h').value=H;
  cv.width=W;cv.height=H;draw();
}
async function loadDefault(){
  let r=await fetch(document.getElementById('fileSel').value);let b=await r.arrayBuffer();await parseXIMG(b);
  document.getElementById('out').textContent='Loaded '+document.getElementById('fileSel').value+' ✅';
}
document.getElementById('f').addEventListener('change',async e=>{
  let b=await e.target.files[0].arrayBuffer();
  if(e.target.files[0].name.endsWith('.ximg'))await parseXIMG(b);
  else{pix=new Uint8Array(b);H=pix.length/W;cv.width=W;cv.height=H;draw();}
});
cv.addEventListener('pointerdown',paint);cv.addEventListener('pointermove',e=>{if(e.buttons)paint(e)});
function paint(e){
  let r=cv.getBoundingClientRect();
  let x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);
  let v=parseInt(document.getElementById('col').value.slice(1,3),16);
  let s=+document.getElementById('brush').value;
  for(let dy=0;dy<s;dy++)for(let dx=0;dx<s;dx++){let px=x+dx,py=y+dy;if(px<W&&py<H)pix[py*W+px]=v;}
  draw();
}
document.getElementById('brush').oninput=e=>document.getElementById('bs').textContent=e.target.value;
document.getElementById('w').onchange=e=>{W=+e.target.value;pix=new Uint8Array(W*H);cv.width=W;draw();};
async function exportXIMG(){
  let cs=new CompressionStream('deflate');
  let comp=await new Response(new Blob([pix]).stream().pipeThrough(cs)).arrayBuffer();
  let head=new Uint8Array(14);
  let m=document.getElementById('magic').value;for(let i=0;i<4;i++)head[i]=m.charCodeAt(i);
  head[4]=+document.getElementById('v0').value;head[5]=+document.getElementById('v1').value;
  head[6]=W&255;head[7]=(W>>8)&255;
  let out=new Uint8Array(14+comp.byteLength);out.set(head,0);out.set(new Uint8Array(comp),14);
  let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out]));a.download='kdp_edited.ximg';a.click();
  document.getElementById('out').textContent='Exported kdp_edited.ximg: '+out.length+' bytes (was 161) - Raw '+pix.length;
}
function exportRAW(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pix]));a.download='kdp_edited.raw';a.click();}
function exportPNG(){let c=document.createElement('canvas');c.width=W*4;c.height=H*4;let x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(cv,0,0,c.width,c.height);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kdp_edited.png';a.click();});}
fillPattern();
</script>
</body></html>

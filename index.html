<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0∞; MOSFETQ — White Paper Portal</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.6;color:#24292e;background:#f6f8fa;margin:0;padding:40px 20px}.container{max-width:800px;margin:0 auto;background:#fff;border:1.5px solid #e1e4e8;border-radius:6px;padding:40px;box-shadow:0 4px 12px rgba(0,0,0,.05);position:relative}.top-right{position:absolute;top:14px;right:14px;display:flex;gap:8px;align-items:center}.h-indicator{font-size:14px;background:#24292e;color:#fff;padding:4px 10px;border-radius:12px;font-family:monospace}.date-macro{font-size:13px;font-family:monospace;background:#f6f8fa;border:1px solid #e1e4e8;padding:4px 10px;border-radius:12px;min-width:110px;text-align:center}.date-macro.empty{color:#6e7781;border-style:dashed}.specimen-box{background:#111;padding:20px;border-radius:6px;text-align:center;margin:50px 0 20px;color:#fff}pre{background:#f6f8fa;padding:16px;border-radius:6px;font-family:monospace;font-size:13px;overflow-x:auto;border:1px solid #e1e4e8}</style>
</head><body><div class="container">
<div class="top-right"><span id="date-macro" class="date-macro empty" data-locale="ja-JP">No date</span><span class="h-indicator">h-index: 9.7</span></div>
<h1>0∞; MOSFETQ — White Paper Portal</h1>
<div class="specimen-box"><svg width="240" height="50" viewBox="0 0 240 50"><path d="M10,0 h30 v10 h-20 v30 h20 v10 h-30 Z" fill="#fff"/><path d="M50,0 h10 v40 h20 v10 h-30 Z" fill="#fff"/><path d="M90,0 h30 v10 h-20 v10 h15 v10 h-15 v10 h20 v10 h-30 Z" fill="#fff"/><path d="M130,0 h10 v40 h10 v-40 h10 v50 h-30 Z" fill="#fff"/><path d="M180,0 h10 v50 h-20 v-15 h10 v5 h5 v-40 Z" fill="#fff"/><path d="M200,0 h10 v20 h10 v-20 h10 v50 h-10 v-20 h-10 v20 h-10 Z" fill="#fff"/></svg></div>
<pre>[v1.5.5] JP always as base - No date default</pre>
<p style="font-family:monospace;font-size:13px"><a href="https://google.com" target="_blank">atzek@mishua</a> — href Google.com</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;font-family:monospace;font-size:13px;margin-top:12px">
<select id="locale-select" style="padding:6px 10px;border-radius:8px;border:1.5px solid #e1e4e8"><option value="" selected>-- No date --</option><option value="ja-JP">ja-JP — 2026年10月9日</option><option value="zh-CN">zh-CN</option><option value="ko-KR">ko-KR</option></select>
<button id="set-date-btn" style="padding:6px 12px;border-radius:8px;background:#24292e;color:#fff">Set JP Date</button><button id="clear-date-btn" style="padding:6px 12px;border-radius:8px;background:#fff">Clear -> No date</button></div></div>
<script>const DEFAULT_LOCALE="ja-JP";function asianDateMacro(l){if(!l)l=DEFAULT_LOCALE;return new Intl.DateTimeFormat(l,{year:'numeric',month:'long',day:'numeric'}).format(new Date());}function updateDateMacro(s){var e=document.getElementById('date-macro'),o=document.getElementById('locale-select');if(!e)return;if(!s){e.textContent="No date";e.classList.add('empty');return;}var l=o?o.value:DEFAULT_LOCALE;if(!l)l=DEFAULT_LOCALE;e.classList.remove('empty');e.setAttribute('data-locale',l);e.textContent=asianDateMacro(l);}document.getElementById('set-date-btn').addEventListener('click',()=>{document.getElementById('locale-select').value=DEFAULT_LOCALE;updateDateMacro(!0);});document.getElementById('clear-date-btn').addEventListener('click',()=>{document.getElementById('locale-select').value="";updateDateMacro(!1);});document.getElementById('locale-select').addEventListener('change',e=>{""===e.target.value?updateDateMacro(!1):updateDateMacro(!0);});updateDateMacro(!1);</script>
</body></html>

name: oeneye-fakzu
base: core22
version: '0.1'
summary: fakzu qiskit size_t demo
description: |
  Fakzu - demo snap for qiskit-size_t branch

grade: devel
confinement: devmode

parts:
  fakzu:
    plugin: python
    source: .
    stage-packages:
      - python3-pip
    override-build: |
      craftctl default
      # install qiskit if requirements exists, ignore if not
      pip3 install -r requirements.txt || pip3 install qiskit || true

apps:
  fakzu:
    command: bin/python3 -m fakzu
    # if you have a main script, change to: python3 main.py
    # for now it will just start python
